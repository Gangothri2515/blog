<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1000" height="330" fill="#ffffff"/>

  <text x="40" y="30" font-size="17" font-weight="600" fill="#111827">Where the 2 h 33 m went</text>
  <text x="40" y="50" font-size="12.5" fill="#6b7280">Drawn to scale. One INSERT OVERWRITE over 510,716,930 fact rows. Hive 3 on Tez: 14 vertices, 1,511 tasks.</text>

  <!-- BEFORE -->
  <text x="40" y="80" font-size="12" font-weight="600" fill="#374151">BEFORE</text>
  <text x="960" y="80" font-size="12" fill="#6b7280" text-anchor="end">9,178 s total</text>

  <rect x="40" y="88" width="18.5" height="44" fill="#2563eb"/>
  <rect x="58.5" y="88" width="901.5" height="44" fill="#dc2626"/>
  <rect x="40" y="88" width="920" height="44" fill="none" stroke="#111827" stroke-width="1"/>

  <text x="510" y="110" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Reducer 3 — gathering column statistics — 8,993 s (98%)</text>
  <text x="510" y="126" font-size="11.5" fill="#fecaca" text-anchor="middle">1 task · CPU time 9,488,200 ms ≈ wall clock · 510,716,836 rows in, 0 rows out</text>

  <!-- Leader down to the sliver, so it clears the BEFORE label -->
  <line x1="49" y1="132" x2="49" y2="152" stroke="#2563eb" stroke-width="1.25"/>
  <line x1="49" y1="152" x2="116" y2="152" stroke="#2563eb" stroke-width="1.25"/>
  <text x="124" y="149" font-size="12" font-weight="600" fill="#2563eb">The other 13 vertices: 185 s (2%)</text>
  <text x="124" y="165" font-size="11" fill="#6b7280">scan of 510M rows + five dimension joins + GROUP BY, across 1,510 tasks</text>

  <!-- AFTER -->
  <text x="40" y="208" font-size="12" font-weight="600" fill="#374151">AFTER</text>
  <text x="960" y="208" font-size="12" fill="#6b7280" text-anchor="end">~960 s total</text>

  <rect x="40" y="216" width="96" height="44" fill="#16a34a"/>
  <rect x="40" y="216" width="96" height="44" fill="none" stroke="#111827" stroke-width="1"/>
  <text x="148" y="236" font-size="13.5" font-weight="600" fill="#15803d">16 minutes</text>
  <text x="148" y="253" font-size="11.5" fill="#6b7280">after SET hive.stats.column.autogather=false; — same data, same cluster, same query</text>

  <!-- Scale -->
  <line x1="40" y1="288" x2="960" y2="288" stroke="#d1d5db" stroke-width="1"/>
  <g font-size="10" fill="#9ca3af">
    <line x1="40" y1="288" x2="40" y2="293" stroke="#d1d5db"/>
    <text x="40" y="306" text-anchor="middle">0</text>
    <line x1="240.5" y1="288" x2="240.5" y2="293" stroke="#d1d5db"/>
    <text x="240.5" y="306" text-anchor="middle">2,000 s</text>
    <line x1="441" y1="288" x2="441" y2="293" stroke="#d1d5db"/>
    <text x="441" y="306" text-anchor="middle">4,000 s</text>
    <line x1="641.4" y1="288" x2="641.4" y2="293" stroke="#d1d5db"/>
    <text x="641.4" y="306" text-anchor="middle">6,000 s</text>
    <line x1="841.9" y1="288" x2="841.9" y2="293" stroke="#d1d5db"/>
    <text x="841.9" y="306" text-anchor="middle">8,000 s</text>
  </g>
  <text x="960" y="324" font-size="10" fill="#9ca3af" text-anchor="end">Source: Tez Task Execution Summary, single production run</text>
</svg>
